[pytest]
markers =
    slow: real TimesFM 3 model tests (checkpoint load + inference). Require
        `timesfm3`/`torch` installed and, on first run, network access to
        download the checkpoint from Hugging Face. Auto-skipped via
        pytest.importorskip when timesfm3 is not importable. Deselected by
        default; run with `-m slow` (or `-m ""` to include everything).
addopts = -m "not slow"
